# bundle patch for the session-title-summary plugin: inserts its plugin row
# into the dsh profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile <name> add link:<repo>`.
- insert:
    - id: session-title-summary
      name: '@xiaochaz/dsh-session-title-summary'
